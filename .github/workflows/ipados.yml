name: 2048 iPadOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipados:
    name: Build unsigned IPA on macOS
    runs-on: macos-15
    steps:
      - name: Checkout game project
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native iPadOS project
        run: xcodegen generate --spec project.yml

      - name: Build app for physical iPad
        run: |
          xcodebuild \
            -project Oyun2048.xcodeproj \
            -scheme Oyun2048 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Oyun2048Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Oyun2048Build/Build/Products/Release-iphoneos/Oyun2048.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Oyun2048.app
          /usr/bin/zip -qry Oyun2048-unsigned.ipa Payload
          test -s Oyun2048-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oyun2048-iPadOS-IPA
          path: Oyun2048-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
